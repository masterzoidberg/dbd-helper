name: Deploy DBD Helper to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Survivor perk data
        run: node scripts/build-survivor-data.mjs

      - name: Verify Survivor perk data
        run: node --test site/tests/*.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test live site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          check() {
            url="${SITE_URL}$1"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              "${url}" -o /tmp/dbd-smoke
            test -s /tmp/dbd-smoke
          }

          check ""
          grep -q "Find what matters before the fog closes in" /tmp/dbd-smoke

          check "survivor/perks/"
          grep -q "Survivor Perks" /tmp/dbd-smoke
          grep -q "10 published" /tmp/dbd-smoke
          grep -q "10.2.0" /tmp/dbd-smoke

          check "assets/app-core.js"
          check "assets/data-perks-01.js"
          check "manifest.webmanifest"
          python3 -m json.tool /tmp/dbd-smoke >/dev/null
          check "sw.js"
