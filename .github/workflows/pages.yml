name: Bootstrap Survivor Meta Artifacts

on:
  push:
    branches: [feature/survivor-meta-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/survivor-meta-foundation

      - name: Import canonical Survivor v15 source
        run: python3 scripts/import-survivor-v15.py --archive dbd-local-data-v15-release-candidate.zip --output content/survivor/perks

      - name: Import frozen Survivor Meta research
        run: python3 scripts/import-survivor-meta.py --archive survivor-meta.zip --output content/survivor/meta/10.2.0-r1 --release 10.2.0-r1

      - name: Build deterministic Survivor Meta artifacts
        run: node scripts/build-survivor-meta.mjs

      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git add content/survivor/meta/10.2.0-r1 site/assets/data-survivor-meta.js site/survivor-meta
          if git diff --cached --quiet; then
            echo "Generated artifacts already match the branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate survivor meta artifacts [skip ci]"
          git push origin HEAD:feature/survivor-meta-foundation
