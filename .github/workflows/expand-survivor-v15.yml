name: Expand staged Survivor v15 import

on:
  push:
    branches: [publish-all-survivor-v15]

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, '[expanded]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: publish-all-survivor-v15

      - name: Reassemble staged archives
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/survivor-import-1*.b64 > /tmp/survivor-import-1.b64
          base64 --decode /tmp/survivor-import-1.b64 > /tmp/survivor-import-1.tar.gz
          echo 'Archive 1:'
          tar -tzf /tmp/survivor-import-1.tar.gz
          tar -xzf /tmp/survivor-import-1.tar.gz -C .

          cat .github/import/survivor-import-2.*.b64 > /tmp/survivor-import-2.b64
          base64 --decode /tmp/survivor-import-2.b64 > /tmp/survivor-import-2.tar.gz
          echo 'Archive 2:'
          tar -tzf /tmp/survivor-import-2.tar.gz
          tar -xzf /tmp/survivor-import-2.tar.gz -C .

      - name: Verify full Survivor import
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-survivor-data.mjs
          node --test site/tests/*.test.mjs
          grep -q '176 published' site/survivor/perks/index.html
          grep -q '"rank":176' site/assets/data-perks-05.js
          grep -q 'invocation-treacherous-crows' site/assets/data-perks-05.js
          grep -q 'dbd-field-guide-v5' site/sw.js

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/import
          rm -f .github/workflows/expand-survivor-v15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand full Survivor v15 dataset [expanded]'
          git push origin HEAD:publish-all-survivor-v15
